name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y potrace autotrace libautotrace-dev python3-pip

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install fastapi httpx python-multipart opencv-python-headless scikit-image scipy numpy pyyaml pytest potrace svgwrite faster-whisper silero-vad

      - name: Build packages
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select wall_climber_interfaces wall_climber_draw_body wall_climber --symlink-install

      - name: Run pytest
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          PYTHONPATH=src/wall_climber python3 -m pytest -q src/wall_climber/test -p no:anyio
